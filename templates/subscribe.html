<section id="subscribe">
  <div class="container">
    <div class="star-divider"><span class="star">❄</span></div>
    <h2>Stay up to date</h2>
    <p>Subscribe to receive updates about the book, upcoming talks, and future expeditions.</p>
      <form id="ml-book-form" novalidate>
        <input type="text" name="website" style="display:none !important" tabindex="-1" autocomplete="off">
        <label for="ml-book-name">Name
          <input type="text" id="ml-book-name" name="name" required
                 autocomplete="name" autocapitalize="words" enterkeyhint="next"
                 placeholder="Maria Muster">
        </label>
        <label for="ml-book-email">Email
          <input type="email" id="ml-book-email" name="email" required
                 autocomplete="email" autocapitalize="none" autocorrect="off"
                 spellcheck="false" enterkeyhint="done"
                 placeholder="maria@example.com">
        </label>
        <altcha-widget id="ml-book-altcha"
          challengeurl="{{ SHOP_API_URL | default('https://order.skitraverse.com') }}/api/captcha"
          name="altcha" hidefooter style="margin-bottom:0.5rem;display:block;"></altcha-widget>
        <button type="submit" id="ml-book-btn" disabled>Subscribe</button>
      </form>
      <div id="ml-book-status" role="alert" style="display:none; margin-top:1rem;"></div>
  </div>
</section>
<script async defer src="https://cdn.jsdelivr.net/npm/altcha/dist/altcha.min.js" type="module"></script>
<script>
(function() {
  var API_BASE = '{{ SHOP_API_URL | default("https://order.skitraverse.com") }}';
  var form   = document.getElementById('ml-book-form');
  var btn    = document.getElementById('ml-book-btn');
  var widget = document.getElementById('ml-book-altcha');
  var status = document.getElementById('ml-book-status');
  var storedAltcha = '';
  widget.addEventListener('statechange', function(e) {
    var payload = (e.detail && e.detail.payload) || widget.value || '';
    var verified = e.detail ? e.detail.state === 'verified' : !!payload;
    storedAltcha = verified ? payload : '';
    refresh();
  });
  widget.addEventListener('change', refresh);
  function valid() {
    return ['ml-book-name','ml-book-email'].every(function(id) {
      return document.getElementById(id).value.trim() !== '';
    }) && !!storedAltcha;
  }
  function refresh() { btn.disabled = !valid(); }
  form.addEventListener('input', refresh);
  form.addEventListener('change', refresh);
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var altchaPayload = storedAltcha;
    if (!altchaPayload) { show('error', 'Please wait for the security check.'); return; }
    btn.disabled = true; btn.textContent = 'Subscribing…';
    try {
      var resp = await fetch(API_BASE + '/api/subscribe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          website: form.querySelector('[name="website"]').value,
          altcha:  altchaPayload,
          name:    document.getElementById('ml-book-name').value.trim(),
          email:   document.getElementById('ml-book-email').value.trim(),
        }),
      });
      if (resp.ok) {
        form.style.display = 'none';
        show('success', '<strong>You\'re on the list!</strong> We\'ll be in touch.');
      } else {
        var data = await resp.json().catch(function() { return {}; });
        show('error', data.error || 'Something went wrong.');
        btn.disabled = false; btn.textContent = 'Subscribe';
      }
    } catch(err) {
      show('error', 'Could not reach the server. Please try again.');
      btn.disabled = false; btn.textContent = 'Subscribe';
    }
  });
  function show(type, html) {
    status.innerHTML = html; status.style.display = '';
    status.style.padding = '1rem'; status.style.borderRadius = '4px';
    status.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
    status.style.color      = type === 'success' ? '#155724' : '#721c24';
  }
})();
</script>
